name: Release

on:
  push:
    tags:
      - 'v*'
  # Rebuild an existing tag and upload its packages to that tag's release.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild, e.g. v0.1.21'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  build-deb:
    if: github.repository == 'iopsystems/llm-perf'
    name: "deb ${{ matrix.distro }}:${{ matrix.release }} (${{ matrix.arch }})"
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      matrix:
        include:
          # debian
          - { distro: debian, release: bookworm, arch: x86_64 }
          - { distro: debian, release: bookworm, arch: arm64 }
          - { distro: debian, release: trixie, arch: x86_64 }

          # ubuntu
          - { distro: ubuntu, release: focal, arch: x86_64 } # 20.04
          - { distro: ubuntu, release: jammy, arch: x86_64 } # 22.04
          - { distro: ubuntu, release: jammy, arch: arm64 } # 22.04
          - { distro: ubuntu, release: noble, arch: x86_64 } # 24.04
          - { distro: ubuntu, release: noble, arch: arm64 } # 24.04
      fail-fast: false
    env:
      DEB_BUILD_OPTS: nocheck
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: run packaging script
        run: |
          mkdir -p target/debian
          docker run --rm                   \
            -v $(pwd):/mnt/llm-perf              \
            -v $(pwd)/target/debian:/mnt/output \
            ${{ matrix.distro }}:${{ matrix.release }} \
            /mnt/llm-perf/debian/package.sh      \
            --release "0"                       \
            --chown "$(id -u)"                  \
            --verbose

      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          path: target/debian/*
          name: deb_${{ matrix.distro }}_${{ matrix.release }}_${{ matrix.arch }}

  build-rpm:
    name: "rpm ${{ matrix.distro }}:${{ matrix.version }} (${{ matrix.arch }})"
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container: "${{ matrix.distro }}:${{ matrix.version }}"
    strategy:
      matrix:
        include:
          - { distro: rockylinux, version: "9", arch: x86_64 }
          - { distro: rockylinux, version: "9", arch: arm64 }
          - { distro: amazonlinux, version: "2023", arch: x86_64 }
          - { distro: amazonlinux, version: "2023", arch: arm64 }
      fail-fast: false
    steps:
      - name: install basic dependencies
        if: matrix.distro == 'amazonlinux'
        shell: bash
        run: |
          yum install -y tar gzip

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: install rust
        run: |
          curl -sSf https://sh.rustup.rs | sh /dev/stdin -y
          echo "PATH=$HOME/.cargo/bin:$PATH" >> "$GITHUB_ENV"

      - name: install build dependencies
        shell: bash
        run: |
          yum install -y gcc elfutils-devel clang openssl-devel

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-rpm-${{ matrix.distro }}-${{ matrix.version}}-${{ matrix.arch }}

      - name: install rpm packaging tool
        run: cargo install cargo-generate-rpm

      - name: build
        shell: bash
        run: |
          cargo build --release --locked

      - name: package
        shell: bash
        run: |
          # Build with cargo-generate-rpm
          cargo generate-rpm --payload-compress gzip

          # Install rpm-build for rebuilding with proper headers
          yum install -y rpm-build

          # Fix each RPM using rpmbuild to add ARCHIVESIZE
          for rpm in target/generate-rpm/*.rpm; do
            echo "Fixing $(basename $rpm) for GCP Artifact Registry..."

            # Extract metadata from the existing RPM
            FULL_VERSION=$(rpm -qp --qf "%{VERSION}" "$rpm")
            RPM_ARCH=$(rpm -qp --qf "%{ARCH}" "$rpm")

            # Parse version and determine release format
            if [[ "$FULL_VERSION" == *"-alpha"* ]]; then
              RPM_VERSION=$(echo "$FULL_VERSION" | cut -d'-' -f1)
              ALPHA_VERSION=$(echo "$FULL_VERSION" | sed 's/.*-alpha\.//')
              RPM_RELEASE="0.1.alpha.${ALPHA_VERSION}"
            elif [[ "$FULL_VERSION" == *"-beta"* ]]; then
              RPM_VERSION=$(echo "$FULL_VERSION" | cut -d'-' -f1)
              BETA_VERSION=$(echo "$FULL_VERSION" | sed 's/.*-beta\.//')
              RPM_RELEASE="0.2.beta.${BETA_VERSION}"
            elif [[ "$FULL_VERSION" == *"-rc"* ]]; then
              RPM_VERSION=$(echo "$FULL_VERSION" | cut -d'-' -f1)
              RC_VERSION=$(echo "$FULL_VERSION" | sed 's/.*-rc\.//')
              RPM_RELEASE="0.3.rc.${RC_VERSION}"
            else
              # Stable release
              RPM_VERSION="$FULL_VERSION"
              RPM_RELEASE="1"
            fi

            echo "  Version: $RPM_VERSION"
            echo "  Release: $RPM_RELEASE"

            # Setup rpmbuild directory
            mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

            # Get current date for changelog
            RPM_DATE=$(date +"%a %b %d %Y")

            # Create spec from template
            sed -e "s/@NAME@/llm-perf/g" \
                -e "s/@VERSION@/${RPM_VERSION}/g" \
                -e "s/@RELEASE@/${RPM_RELEASE}/g" \
                -e "s/@ARCH@/${RPM_ARCH}/g" \
                -e "s/@DATE@/${RPM_DATE}/g" \
                rpm/llm-perf.spec.template > ~/rpmbuild/SPECS/llm-perf.spec

            # Rebuild the RPM with proper headers
            rpmbuild -bb \
              --define "_topdir $HOME/rpmbuild" \
              --define "_sourcedir $GITHUB_WORKSPACE" \
              --define "_binary_payload w9.gzdio" \
              ~/rpmbuild/SPECS/llm-perf.spec

            # Replace the original RPM with the fixed one
            mv ~/rpmbuild/RPMS/*/*.rpm "$rpm"

            # Cleanup for next iteration
            rm -rf ~/rpmbuild
          done

          # Final verification
          echo ""
          echo "Verifying ARCHIVESIZE headers:"
          for rpm in target/generate-rpm/*.rpm; do
            echo "$(basename $rpm):"
            rpm -qp --qf "  VERSION: %{VERSION}\n  RELEASE: %{RELEASE}\n  ARCHIVESIZE: %{ARCHIVESIZE}\n" "$rpm"
          done

      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          path: target/generate-rpm/*
          name: rpm_${{ matrix.distro }}_${{ matrix.version }}_${{ matrix.arch }}

  publish:
    name: Publish GitHub Release
    needs: [build-deb, build-rpm]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Several matrix entries build files with the same name, so each
      # artifact must land in its own directory, named after the artifact.
      # download-artifact skips that directory when a pattern matches one
      # artifact; the next step fails if that happens.
      - name: Download .deb artifacts
        uses: actions/download-artifact@v7
        with:
          path: target/artifacts/
          pattern: deb_*

      - name: Download .rpm artifacts
        uses: actions/download-artifact@v7
        with:
          path: target/artifacts/
          pattern: rpm_*

      - name: Prefix file names with distro, release and arch
        run: |
          set -euo pipefail
          mkdir -p target/release
          if [ -n "$(find target/artifacts -maxdepth 1 -type f)" ]; then
            echo "::error::files outside an artifact directory; a pattern matched one artifact"
            exit 1
          fi
          for artifact in target/artifacts/*/*; do
            # directory format: <deb|rpm>_<distro>_<release>_<arch>
            directory="$(basename "$(dirname "$artifact")")"
            case "$directory" in
              deb_*|rpm_*) ;;
              *) echo "::error::unexpected directory $directory"; exit 1 ;;
            esac
            dest="target/release/${directory#*_}_$(basename "$artifact")"
            if [ -e "$dest" ]; then
              echo "::error::two artifacts map to $(basename "$dest")"
              exit 1
            fi
            cp "$artifact" "$dest"
          done
          ls -la target/release

      - name: Verify packages
        run: |
          set -euo pipefail
          sudo apt-get -q update
          sudo apt-get -q install -y rpm
          shopt -s nullglob
          cd target/release
          # `ar t` exits 1 on bytes after the last member; the tar listing
          # decompresses the whole payload. `rpm -K` checks the header and
          # payload digests.
          for f in *.deb *.ddeb; do
            echo "checking $f"
            ar t "$f" >/dev/null
            dpkg-deb --info "$f" >/dev/null
            dpkg-deb --fsys-tarfile "$f" | tar -t >/dev/null
          done
          for f in *.rpm; do
            rpm -K --nosignature "$f"
          done
          sha256sum -- *.deb *.ddeb *.rpm > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        run: |
          set -euo pipefail
          # A rebuild only replaces assets on a release that already exists.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" target/release/* --clobber
          else
            gh release create "$TAG" --verify-tag --generate-notes target/release/*
          fi
