# Replay coding-agent sessions from `llm-perf convert-trace` against
# llama-server or vLLM. Convert with --max-context set to the server's per-request
# context: default_generation_settings.n_ctx in llama-server's /props, or
# max_model_len in vLLM's /v1/models.

[endpoint]
base_url = "http://localhost:8080/v1"
timeout = 600
# Llama 3.1: pin the date the chat template inserts, so prompts do not change
# at midnight. Qwen3.5: use { enable_thinking = false } instead; replay sends
# back the reply's content only.
chat_template_kwargs = { date_string = "26 Jul 2024" }

[load]
duration_seconds = 3600   # optional; the run ends at this limit or when every session finishes, whichever is first
warmup_duration = 60      # optional; calls sent in the first 60 s are left out of metrics and of the reuse, lag and TTFT results

[output]
format = "console"

[replay]
trace = "trace.jsonl"
# server = "vllm"         # default "llama-server"; vLLM needs --enable-prefix-caching and --enable-prompt-tokens-details
sample = 0.001            # fraction of sessions, chosen by session id; 1.0 replays all
speedup = 24.0            # divides session start offsets, call durations and gaps
# sample_seed = 0         # a different sample of the same size
# max_gap_ms = 300000     # cap each gap after speedup; capped calls are flagged in the log
# system_prompt_tokens = 0 # a system prompt of this many tokens shared by every session
seed = 1                  # filler text; change it, or restart the server, between runs
log = "replay.jsonl"      # one line per call: prompt and cached tokens, timings
